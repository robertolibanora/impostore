<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Gioco dell'impostore per i Moderati" />
  <title>Impostore dei Moderati - Setup</title>
  
  <!-- PWA -->
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Impostore">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  
  <script>
    // Registra il service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('Service Worker registrato:', registration);
          })
          .catch((error) => {
            console.log('Service Worker registrazione fallita:', error);
          });
      });
    }
  </script>
</head>
<body>
  <style>
    .modeSelect {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 360px;
      padding: 0 8px;
    }

    .modeBtn {
      flex: 1;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: #888888;
      font-weight: 600;
      padding: 14px 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      text-align: center;
      transition: all 0.25s ease;
      touch-action: manipulation;
    }

    .modeBtn.active {
      color: #ffffff;
      border-color: rgba(255, 0, 64, 0.5);
      background: rgba(255, 0, 64, 0.08);
      box-shadow: 0 0 20px rgba(255, 0, 64, 0.15);
    }

    .modeHint {
      font-size: 9px;
      letter-spacing: 0.2em;
      color: #666666;
      text-align: center;
      margin-bottom: 48px;
      padding: 0 24px;
      line-height: 1.6;
      max-width: 360px;
      font-weight: 500;
      text-transform: none;
    }

    #impostorsBlock {
      transition: opacity 0.25s ease;
    }

    #impostorsBlock.hidden {
      display: none;
    }
  </style>

  <div class="screen">
    <h1>IMPOSTORE<span class="subtitle">DEI MODERATI</span></h1>

    <div class="modeSelect">
      <div class="modeBtn active" id="modeImpostore" data-mode="impostore">IMPOSTORE</div>
      <div class="modeBtn" id="modeAmnesia" data-mode="amnesia">AMNESIA</div>
    </div>
    <div class="modeHint" id="modeHint">Uno (o più) non sa la parola. Tutti gli altri sì.</div>
    
    <div class="control">
      <div class="btn" id="pMinus">−</div>
      <div class="value" id="players">6</div>
      <div class="btn" id="pPlus">+</div>
    </div>
    <div class="label">PLAYERS</div>

    <div id="impostorsBlock">
      <div class="control">
        <div class="btn" id="iMinus">−</div>
        <div class="value" id="impostors">1</div>
        <div class="btn" id="iPlus">+</div>
      </div>
      <div class="label">IMPOSTORS</div>
    </div>

    <div class="start" id="startBtn">TAP TO START</div>
  </div>

  <script>
    let players = 6;
    let impostors = 1;
    let mode = 'impostore';

    const modeHints = {
      impostore: 'Uno (o più) non sa la parola. Tutti gli altri sì.',
      amnesia: 'Ognuno ha una parola che solo lui non conosce. Vedi quelle degli altri.'
    };

    initAudio();

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('modeImpostore').classList.toggle('active', mode === 'impostore');
      document.getElementById('modeAmnesia').classList.toggle('active', mode === 'amnesia');
      document.getElementById('modeHint').textContent = modeHints[mode];
      document.getElementById('impostorsBlock').classList.toggle('hidden', mode === 'amnesia');
      playButtonClickSound();
    }

    document.getElementById('modeImpostore').onclick = e => {
      e.stopPropagation();
      if (mode !== 'impostore') setMode('impostore');
    };
    document.getElementById('modeAmnesia').onclick = e => {
      e.stopPropagation();
      if (mode !== 'amnesia') setMode('amnesia');
    };

    document.getElementById("pPlus").onclick = e => { 
      e.stopPropagation(); 
      if(players<20){
        players++; 
        upd();
        playButtonClickSound();
      }
    };
    document.getElementById("pMinus").onclick = e => { 
      e.stopPropagation(); 
      if(players>3){
        players--; 
        if(impostors>=players) impostors=players-1; 
        upd();
        playButtonClickSound();
      }
    };
    document.getElementById("iPlus").onclick = e => { 
      e.stopPropagation(); 
      if(impostors<players-1){
        impostors++; 
        upd();
        playButtonClickSound();
      }
    };
    document.getElementById("iMinus").onclick = e => { 
      e.stopPropagation(); 
      if(impostors>1){
        impostors--; 
        upd();
        playButtonClickSound();
      }
    };

    function upd(){
      document.getElementById("players").textContent = players;
      document.getElementById("impostors").textContent = impostors;
    }

    document.getElementById("startBtn").onclick = () => {
      playStartGameSound();
      setTimeout(() => {
        const impostorsParam = mode === 'impostore' ? impostors : 0;
        window.location.href = `/players?players=${players}&impostors=${impostorsParam}&mode=${mode}`;
      }, 300);
    };
  </script>
</body>
</html>
